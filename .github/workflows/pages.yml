# Builds the demo site in site/ and deploys it to GitHub Pages at
# https://duoquote.github.io/polytini/. The site imports polytini from src/,
# so a change to the library redeploys it too. Pull requests only build it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'types/**'
      - 'assets/**'
      - 'llms.txt'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'src/**'
      - 'types/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a running deploy finish; a newer push deploys right after it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Only the site's own dependencies: the build reads polytini from
      # ../src and its types from ../types, with no npm install at the root.
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # The playground's detector, fixes, compaction and file formats, under Node.
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
