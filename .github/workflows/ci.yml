# CI for polytini once it lives in its own repository
# (github.com/Duoquote/polytini). Inside the polyline-benchmark repository
# this file is inert; that repository's own workflow runs the same checks.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node test/run.js

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: bun test/run.js

  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: deno run -A test/run.js

  # Cloudflare Workers: the packed package bundled by wrangler and run in
  # workerd locally (scripts/test-workers.js). No account, nothing deployed.
  workers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:workers

  # JSR builds the docs on its server, without node_modules, so check the
  # package the same way: a clean checkout, no npm install, and Deno told to
  # ignore package.json (otherwise it asks for the devDependencies).
  jsr:
    runs-on: ubuntu-latest
    env:
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: JSR type files import only this package's files
        run: node scripts/check-jsr-types.js
      - name: No node_modules
        run: test ! -e node_modules
      - run: deno publish --dry-run --allow-dirty
      - name: deno doc --lint on every JSR export
        run: deno doc --lint $(node -p 'Object.values(require("./jsr.json").exports).join(" ")')
      - name: Every JSR export has a module doc
        run: node scripts/check-jsr-docs.js

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: No runtime dependencies
        run: node scripts/check-deps.js
      - name: Size budgets
        run: node scripts/size.js
      - name: llms-full.txt is generated from the current types and docs
        run: node scripts/llms.js --check
      - name: The committed .wasm matches the .wat
        run: node scripts/build-wasm.js && git diff --exit-code -- wasm/polytini.wasm src/wasm-bytes.js
      - name: Coverage
        run: npx c8 --reporter=text-summary --include='src/**' node test/run.js
      - name: Integration types against the real libraries
        run: for c in test/fixtures/*/tsconfig.json; do echo "$c"; npx tsc -p "$c" || exit 1; done
      # npm refuses even a dry run once the version is on the registry, so
      # after a release (until the next version bump) check the pack instead.
      - name: npm publish dry run
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@duoquote/polytini@$v" version 2>/dev/null | grep -q .; then
            echo "$v is already on npm, checking the pack instead"
            npm pack --dry-run
          else
            npm publish --dry-run
          fi

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: node test/smoke.js

  # Optional: regenerates the PostGIS parity fixtures against a real PostGIS
  # and fails if they changed. Manual runs only, so a PostGIS image update
  # never blocks a pull request.
  postgis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest # amd64; the fixture depends on x86-64 int conversion
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate the PostGIS fixtures and fail if they changed
        env:
          POSTGIS_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/postgis-fixtures.js --check
